server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Applied per-location, not once at server level: nginx drops
    # server-level add_header directives for any location that defines its
    # own (e.g. the Cache-Control ones below), it doesn't merge them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # sw.js controls PWA updates -- must never be cached, or clients get
    # stuck on a stale service worker after a release.
    location = /sw.js {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.json {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Hashed build assets (assets/index-<hash>.js) are safe to cache forever.
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # No client-side router in this app, but fall back to index.html anyway.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
